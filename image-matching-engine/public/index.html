<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Matching Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                <h1>MatchEngine AI</h1>
            </div>
            <p>Semantic Image-to-Content Matching</p>
        </header>

        <main>
            <div class="layout">
                <!-- Posts Sidebar -->
                <aside class="posts-sidebar">
                    <h2>Target Content (Posts)</h2>
                    <div id="posts-list" class="posts-list">
                        <!-- Posts injected here -->
                    </div>
                </aside>

                <!-- Match Area -->
                <section class="match-area">
                    <div id="loading-state" class="state-card hidden">
                        <div class="spinner"></div>
                        <p>Analyzing semantic similarity...</p>
                    </div>
                    
                    <div id="empty-state" class="state-card">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        <p>Select a post to find the best image match.</p>
                    </div>

                    <div id="result-card" class="result-card hidden">
                        <div class="result-header">
                            <span id="match-status" class="badge"></span>
                            <span id="match-score" class="score"></span>
                        </div>
                        
                        <div class="image-preview">
                            <img id="candidate-image" src="" alt="Candidate image">
                        </div>

                        <div class="match-details">
                            <h3>Mismatch Guard Reason</h3>
                            <p id="match-reason" class="reason-text"></p>
                        </div>

                        <div class="metadata">
                            <div class="meta-item">
                                <span class="label">Detected Subject:</span>
                                <span id="meta-subject" class="value"></span>
                            </div>
                            <div class="meta-item">
                                <span class="label">Confidence:</span>
                                <span id="meta-confidence" class="value"></span>
                            </div>
                        </div>

                        <div class="actions">
                            <button id="btn-approve" class="btn btn-success">Approve Match</button>
                            <button id="btn-reject" class="btn btn-danger">Reject Match</button>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
